# НЕ ПРОВЕРЕНО: workflow написан, но ни разу не запускался. Первый запуск смотрите вручную.
name: release-windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: desktop
      - run: npx tsc --noEmit && npm test
        working-directory: desktop
      - run: npm ci || npm install
        working-directory: backend
      - run: npx prisma generate && npm test
        working-directory: backend
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
        working-directory: desktop
      # Иконки: положите свою в desktop/app-icon.png (1024x1024) перед сборкой.
      - run: npx tauri icon app-icon.png
        working-directory: desktop
      - name: tauri build
        shell: bash
        working-directory: desktop
        run: |
          set +e
          npx tauri build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -nE "error|warning: unused|panicked|failed" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            tail -25 build.log | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
          fi
          exit $code
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: dropminer-windows
          path: desktop/src-tauri/target/release/bundle/**/*
