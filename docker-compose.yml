services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropminer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropminer}
      POSTGRES_DB: dropminer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropminer"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://dropminer:${DB_PASSWORD:-dropminer}@db:5432/dropminer
    ports:
      - "4000:4000"
    # Ротация логов: не больше 5 файлов по 10 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
